name: engine

on:
  workflow_call:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ github.workflow }}-engine-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reference:
    name: engine reference corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup reference runtime
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Verify corpus against the live TypeScript reference
        run: |
          bun crates/miao-engine/tests/differential/generate.ts --check
          bun crates/miao-engine/tests/differential/generate-agent-policy.ts --check
          bun crates/miao-engine/tests/differential/generate-permission-decide.ts --check
          bun crates/miao-engine/tests/differential/generate-personas.ts --check

  engine:
    name: engine (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS leg runs on the owner's self-hosted arm64 runner: hosted
          # macOS minutes bill at 10x, so one full engine run spends more than
          # the account's entire monthly allowance. It stays one job: a single
          # self-hosted runner runs one job at a time, so sharding there would
          # only queue the shards behind each other.
          - os: macos-14
            runner: [self-hosted, macOS, ARM64]
            shard: 1
            shards: 1
          # The ubuntu leg is the longest single job of a full CI run, so its
          # 176 test targets are split across four parallel jobs.
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            shard: 1
            shards: 4
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            shard: 2
            shards: 4
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            shard: 3
            shards: 4
          - os: ubuntu-24.04
            runner: ubuntu-24.04
            shard: 4
            shards: 4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The self-hosted macOS runner shares one volume with every cached build
      # tree. A full volume surfaces as unrelated link errors, or as a killed
      # test process reported as SIGTERM. Fail with the actual reason instead.
      - name: Require free disk (self-hosted runner)
        if: matrix.os == 'macos-14'
        run: |
          free=$(df -m "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          echo "free disk under $RUNNER_TEMP: ${free}MB"
          if [ "${free:-0}" -lt 8000 ]; then
            echo "::error::runner has ${free}MB free but needs 8000MB; prune ~/builds before rerunning"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The self-hosted macOS runner is a launchd service whose PATH omits
      # ~/.cargo/bin, so the dtolnay GITHUB_PATH export does not reach later
      # steps and cargo resolves as command-not-found. Re-add it explicitly.
      - name: Ensure cargo is on PATH (self-hosted runner)
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The self-hosted macOS runner keeps crates/miao-engine/target on disk
      # between jobs, so the cache is pure overhead there: the save pushed
      # ~430 GiB/day through the proxy node on 2026-10-30, and the restore then
      # spent 1m44s re-downloading an archive it did not need. The hosted
      # Ubuntu runner is ephemeral and still needs both halves.
      - name: Cache Rust
        if: matrix.os == 'ubuntu-24.04'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Credential daemon format
        run: cargo fmt --manifest-path ../miao-credential/Cargo.toml --check

      - name: Credential daemon clippy
        run: cargo clippy --manifest-path ../miao-credential/Cargo.toml --all-targets -- -D warnings

      - name: Credential daemon tests
        run: cargo test --manifest-path ../miao-credential/Cargo.toml --locked

      - name: Test
        env:
          RUST_MIN_STACK: "16777216"
        run: bash ../../script/engine-test-shard.sh "${{ matrix.shard }}" "${{ matrix.shards }}"

      - name: Setup ACP client runtime
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Verify native product contracts and independent ACP SDK
        working-directory: packages/miao
        env:
          MIAO_ENGINE_BIN: ${{ github.workspace }}/crates/miao-engine/target/debug/miao-engine
          INTEGRATION_REQUIRE_ENGINE: "1"
          INTEGRATION_TEST_TIMEOUT: "120000"
        run: bash ../../script/test-integration.sh test/engine/native-*.test.ts

      - name: Verify accuracy checks detect injected faults
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tests/accuracy/sensitivity.py

  engine-windows:
    name: engine (windows)
    # Windows runner time is expensive and this suite takes most of an hour, so it
    # stays off both the pull-request and the push path. The nightly schedule is
    # the early warning, and `release.yml` runs the same suite on the release
    # commit and gates publishing on it, so a Windows regression cannot ship
    # without one of those two runs having seen it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Test
        # SQLite-backed event waits compete for disk on hosted Windows runners.
        # Serialize these tests rather than relax their event deadlines.
        run: cargo test -- --test-threads=1

      - name: Credential daemon tests
        run: cargo test --locked --manifest-path ../miao-credential/Cargo.toml

      - name: Credential daemon clippy
        run: cargo clippy --locked --manifest-path ../miao-credential/Cargo.toml --all-targets -- -D warnings

      - name: Setup product client runtime
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts

      - name: Verify native and TypeScript long tasks through actual HTTP
        working-directory: packages/miao
        env:
          MIAO_ENGINE_BIN: ${{ github.workspace }}/crates/miao-engine/target/debug/miao-engine.exe
        run: |
          test -f "$MIAO_ENGINE_BIN"
          "$MIAO_ENGINE_BIN" --version
          bun test --timeout 120000 test/engine/native-default-parity-http.test.ts test/engine/native-allowance-http.test.ts test/engine/native-explicit-route-http.test.ts test/engine/native-product-policy-http.test.ts

