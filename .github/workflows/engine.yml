name: engine

on:
  workflow_call:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ github.workflow }}-engine-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reference:
    name: engine reference corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup reference runtime
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Verify corpus against the live TypeScript reference
        run: |
          bun crates/miao-engine/tests/differential/generate.ts --check
          bun crates/miao-engine/tests/differential/generate-agent-policy.ts --check
          bun crates/miao-engine/tests/differential/generate-permission-decide.ts --check
          bun crates/miao-engine/tests/differential/generate-personas.ts --check

  engine:
    name: engine (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        # macOS legs run on push to main and the nightly schedule: the
        # self-hosted runner is unreliable on pull requests, and a reusable
        # workflow's job-level `if` cannot read the matrix context, so the
        # choice has to live in the matrix itself.
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":1,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":2,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":3,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":4,"shards":4,"experimental":false}]') || fromJSON('[{"os":"macos-arm64","runner":["self-hosted","macOS","ARM64"],"shard":1,"shards":1,"experimental":true},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":1,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":2,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":3,"shards":4,"experimental":false},{"os":"ubuntu-24.04","runner":"ubuntu-24.04","shard":4,"shards":4,"experimental":false}]') }}
    runs-on: ${{ matrix.runner }}
    # The macOS leg reports but does not gate yet: the only host that can run it
    # keeps failing to build aws-lc-sys (the extracted crate is missing its
    # vendored iOS asm), so a permanently red leg blocked every release for a
    # reason unrelated to the merge. It still runs and still shows red.
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 60
    env:
      # Three self-hosted runners share one 16 GB arm64 host; an uncapped
      # `cargo test` build peaks near 3 GB of rustc, so cap the job count to
      # keep three concurrent legs inside memory instead of swapping.
      # Four matches a hosted runner's core count, so Linux is unaffected; on
      # macOS it bounds each of the three runners sharing a 16 GB host.
      CARGO_BUILD_JOBS: "4"
      # Debug info is most of an engine test binary. One build host produced
      # 70 GB of `target/debug/deps` for the crate's 181 test targets with the
      # default profile, which is far more than a hosted runner has free.
      # Line tables keep failure backtraces readable for a fraction of that.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A full volume is the failure both legs keep reporting, and it surfaces
      # as something unrelated: on the self-hosted macOS runner as link errors
      # or a SIGTERM-killed test process, on the hosted Ubuntu runner as
      # `rustc-LLVM ERROR: IO failure on output stream: No space left on
      # device` halfway through compiling a shard. The hosted image also ships
      # toolchains this crate never uses, which is the cheapest space to get
      # back. Reclaim that, then refuse to start when what is left cannot hold
      # a shard, so a disk problem names itself instead of looking like a
      # broken merge.
      - name: Reclaim unused runner disk (hosted runner)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf /usr/share/miniconda /usr/share/swift /opt/pipx /usr/lib/jvm /usr/share/rust
          sudo docker image prune -af || true
          df -h "$RUNNER_TEMP"

      - name: Require free disk
        run: |
          free=$(df -m "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          echo "free disk under $RUNNER_TEMP: ${free}MB"
          if [ "${free:-0}" -lt 12000 ]; then
            echo "::error::runner has ${free}MB free but an engine shard needs 12000MB; prune unused build trees before rerunning"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The self-hosted macOS runner is a launchd service whose PATH omits the
      # toolchain. `~/.cargo/bin` is not the answer on that host: every binary
      # there is a shim that execs `~/.cargo/bin/rustup`, and when rustup
      # replaces itself the shims are left dangling, which reads as
      # `cargo: command not found` long after this step ran. Point PATH at the
      # toolchain's own bin directory instead — `rustup which` names it, the
      # binaries there are real files, and the step proves cargo runs before
      # any later step depends on it.
      - name: Ensure cargo is on PATH (self-hosted runner)
        run: |
          cargo_bin="$(dirname "$(rustup which --toolchain stable cargo)")"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          "$cargo_bin/cargo" --version

      # The self-hosted macOS runner keeps crates/miao-engine/target on disk
      # between jobs, so the cache is pure overhead there: the save pushed
      # ~430 GiB/day through the proxy node on 2026-10-30, and the restore then
      # spent 1m44s re-downloading an archive it did not need. The hosted
      # Ubuntu runner is ephemeral and still needs both halves.
      - name: Cache Rust
        if: matrix.os == 'ubuntu-24.04'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Credential daemon format
        run: cargo fmt --manifest-path ../miao-credential/Cargo.toml --check

      - name: Credential daemon clippy
        run: cargo clippy --manifest-path ../miao-credential/Cargo.toml --all-targets -- -D warnings

      - name: Credential daemon tests
        run: cargo test --manifest-path ../miao-credential/Cargo.toml --locked

      - name: Test
        env:
          RUST_MIN_STACK: "16777216"
        run: bash ../../script/engine-test-shard.sh "${{ matrix.shard }}" "${{ matrix.shards }}"

      - name: Verify accuracy checks detect injected faults
        if: matrix.os == 'ubuntu-24.04'
        run: python3 tests/accuracy/sensitivity.py

  engine-windows-check:
    name: engine (windows compile)
    # Compile-only, on the pull-request path. The full Windows suite below takes
    # most of an hour and runs only on the nightly schedule and the release, so
    # `#[cfg(windows)]` code had no PR-time coverage at all: #2441 renamed a
    # parameter in two of three cfg branches, only the Windows one failed, and
    # Linux and macOS could not see it. The break surfaced at release time, where
    # `publish` depends on `engine-windows` and the whole 0.3.28 shipment stopped.
    #
    # `cargo check --all-targets` compiles the library *and* every test target
    # for the host Windows toolchain, which is what catches a cfg-only mistake
    # without paying for a full test run.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Compile every target
        run: cargo check --locked --all-targets

  engine-windows:
    name: engine (windows)
    # Windows runner time is expensive and this suite takes most of an hour, so it
    # stays off both the pull-request and the push path. The nightly schedule is
    # the early warning, and `release.yml` runs the same suite on the release
    # commit and gates publishing on it, so a Windows regression cannot ship
    # without one of those two runs having seen it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Test
        # SQLite-backed event waits compete for disk on hosted Windows runners.
        # Serialize these tests rather than relax their event deadlines.
        run: cargo test -- --test-threads=1

      - name: Credential daemon tests
        run: cargo test --locked --manifest-path ../miao-credential/Cargo.toml

      - name: Credential daemon clippy
        run: cargo clippy --locked --manifest-path ../miao-credential/Cargo.toml --all-targets -- -D warnings
