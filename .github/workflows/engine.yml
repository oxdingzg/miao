name: engine

on:
  push:
    branches:
      - main
    paths:
      - "crates/miao-engine/**"
      - "crates/miao-sandbox/**"
      - "package.json"
      - ".github/workflows/engine.yml"
      - "packages/core/src/patch.ts"
      - "packages/core/src/flag/**"
      - "packages/native/**"
      - "bun.lock"
  pull_request:
    paths:
      - "crates/miao-engine/**"
      - "crates/miao-sandbox/**"
      - "package.json"
      - ".github/workflows/engine.yml"
      - "packages/core/src/patch.ts"
      - "packages/core/src/flag/**"
      - "packages/native/**"
      - "bun.lock"
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  reference:
    name: engine reference corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup reference runtime
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile --ignore-scripts
      - name: Verify corpus against the live TypeScript reference
        run: bun crates/miao-engine/tests/differential/generate.ts --check

  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Verify accuracy checks detect injected faults
        if: matrix.os == 'ubuntu-latest'
        run: python3 tests/accuracy/sensitivity.py

  engine-windows:
    name: engine (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Test
        run: cargo test

  artifacts:
    name: engine artifact (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/miao-engine${EXE}" "dist/miao-engine-${{ matrix.target }}${EXE}"
          cd dist
          shasum -a 256 "miao-engine-${{ matrix.target }}${EXE}" > "miao-engine-${{ matrix.target }}${EXE}.sha256"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miao-engine-${{ matrix.target }}
          path: crates/miao-engine/dist/*
          if-no-files-found: error
