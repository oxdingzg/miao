name: ios-core
on:
  pull_request:
    paths:
      - apps/ios/**
      - packages/remote-control/src/**
      - packages/miao/src/runtime/**
      - packages/miao/test/runtime/native-app.ts
      - .github/workflows/ios-core.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  crypto-interop:
    runs-on: macos-14
    # Both invitation and account UI scenarios have bounded multi-launch validation.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --ignore-scripts --frozen-lockfile
      - name: Swift core tests
        run: swift test --package-path apps/ios/MiaoCore
      - name: Native signed roster admission integration
        env:
          MIAO_NATIVE_ROSTER_PROBE: apps/ios/MiaoCore/.build/debug/RosterAdmissionProbe
        run: bun packages/remote-control/script/check-native-roster.ts
      - name: iOS platform source check
        run: >-
          xcrun --sdk iphoneos swiftc -typecheck
          -target arm64-apple-ios17.0
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          apps/ios/MiaoCore/Sources/MiaoCore/*.swift
      - name: Universal native app build
        run: >-
          sh apps/ios/scripts/build-app.sh -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/miao-ios-app" CODE_SIGNING_ALLOWED=NO
      - name: iPhone UI smoke test
        run: sh apps/ios/scripts/test-app.sh iphone -derivedDataPath "$RUNNER_TEMP/miao-ios-ui"
      - name: iPad UI smoke test
        run: sh apps/ios/scripts/test-app.sh ipad -derivedDataPath "$RUNNER_TEMP/miao-ios-ui"
      - name: WebCrypto and CryptoKit interoperability
        env:
          MIAO_SWIFT_PROBE_COMMAND: '["apps/ios/MiaoCore/.build/debug/InteropProbe"]'
        run: bun apps/ios/scripts/check-interop.ts
      - name: Native WebSocket transport integration
        env:
          MIAO_SWIFT_TRANSPORT_PROBE_COMMAND: '["apps/ios/MiaoCore/.build/debug/TransportProbe"]'
        run: bun apps/ios/scripts/check-transport.ts
      - name: Native device pairing integration
        env:
          MIAO_SWIFT_PAIRING_PROBE_COMMAND: '["apps/ios/MiaoCore/.build/debug/PairingProbe"]'
        run: bun apps/ios/scripts/check-pairing.ts
      - name: Native app against a real Runtime
        run: bun apps/ios/scripts/check-app.ts
      - name: Native Hub account and Keychain integration
        run: bun apps/ios/scripts/check-account.ts
      - name: Native account app against a real Runtime
        env:
          MIAO_UI_TEST_ACCOUNT: "1"
        run: bun apps/ios/scripts/check-app.ts

  roster-app:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --ignore-scripts --frozen-lockfile
      - name: Native enrolled account app against a real Runtime
        env:
          MIAO_UI_TEST_ENROLLMENT: "1"
        run: bun apps/ios/scripts/check-app.ts
