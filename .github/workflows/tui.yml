name: tui

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ github.workflow }}-tui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tui:
    name: tui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted macOS bills at 10x, and when GitHub has no hosted macOS slot
          # the job is assigned and cancelled within a second — which turned
          # ci-gate red for reasons that had nothing to do with the change. Run
          # it on the owner's self-hosted arm64 runner, as the engine workflow
          # already does.
          - os: macos-14
            runner: [self-hosted, macOS, ARM64]
          - os: ubuntu-latest
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    # The self-hosted macOS runner has no warm cargo cache for this crate, so
    # the first build of a run plus the PTY smoke suite passes the old 30
    # minutes and the job was killed at 30m20s.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The self-hosted macOS runner is a launchd service whose PATH omits
      # ~/.cargo/bin, so the dtolnay GITHUB_PATH export does not reach later
      # steps.
      - name: Ensure cargo is on PATH (self-hosted runner)
        if: matrix.os == 'macos-14'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-tui

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The smoke suite drives real PTYs; run its files one test at a time so
        # concurrent PTY fixtures cannot race each other into false failures.
        run: cargo test -- --test-threads=1

  tui-windows:
    name: tui (windows)
    # Same constraint as the engine's Windows job: Windows runner time is
    # expensive, so this stays off both the pull-request and the push path.
    # The nightly schedule is the early warning, and manual dispatch runs it
    # on demand (e.g. to prove a slice green on the same SHA as a PR).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-tui

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The smoke suite drives real PTYs; run its files one test at a time so
        # concurrent PTY fixtures cannot race each other into false failures.
        run: cargo test -- --test-threads=1
