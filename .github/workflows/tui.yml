name: tui

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ github.workflow }}-tui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tui:
    name: tui (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS legs run on push to main and the nightly schedule: the
        # self-hosted runner is unreliable on pull requests, and a reusable
        # workflow's job-level `if` cannot read the matrix context, so the
        # choice has to live in the matrix itself.
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"ubuntu-latest","runner":"ubuntu-latest"}]') || fromJSON('[{"os":"macos-14","runner":["self-hosted","macOS","ARM64"]},{"os":"ubuntu-latest","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      # Shares one 16 GB arm64 host with the engine legs.
      # Four matches a hosted runner's core count, so Linux is unaffected; on
      # macOS it bounds each of the three runners sharing a 16 GB host.
      CARGO_BUILD_JOBS: "4"
    # The self-hosted macOS runner has no warm cargo cache for this crate, so
    # the first build of a run plus the PTY smoke suite passes the old 30
    # minutes and the job was killed at 30m20s.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The self-hosted macOS runner is a launchd service whose PATH omits the
      # toolchain. `~/.cargo/bin` is not the answer on that host: every binary
      # there is a shim that execs `~/.cargo/bin/rustup`, and when rustup
      # replaces itself the shims are left dangling, which reads as
      # `cargo: command not found` long after this step ran. Point PATH at the
      # toolchain's own bin directory instead — `rustup which` names it, the
      # binaries there are real files, and the step proves cargo runs before
      # any later step depends on it.
      - name: Ensure cargo is on PATH (self-hosted runner)
        if: matrix.os == 'macos-14'
        run: |
          cargo_bin="$(dirname "$(rustup which --toolchain stable cargo)")"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          "$cargo_bin/cargo" --version

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-tui

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        # The smoke suite drives real PTYs; run its files one test at a time so
        # concurrent PTY fixtures cannot race each other into false failures.
        #
        # `--no-fail-fast` is not cosmetic: `cargo test` stops at the first
        # failing test binary, and these suites run in name order, so an
        # `input_latency` failure meant `interaction_*` and `smoke` — every
        # Session test — never ran. A red job then proved nothing about the
        # suites behind it, and the launcher rewrite left `smoke` broken while
        # CI reported one unrelated failure.
        run: cargo test --locked --no-fail-fast -- --test-threads=1

      # VAL-03 (#1910) asks for keystrokes and time-to-state on six tasks, and
      # those numbers are printed only under `--nocapture`: the step above
      # proves the suites pass and says nothing about what they measured, so
      # the acceptance record could only ever cite somebody's own machine.
      # Re-running the six baseline binaries with their output visible and
      # lifting the numbers into the step summary makes the baseline citable
      # from a run id. Linux only — the numbers are compared across runs of the
      # same runner image, and the macOS legs are a shared self-hosted host.
      - name: VAL-03 baselines
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --locked --no-fail-fast \
            --test startup_latency \
            --test interaction_cost \
            --test interaction_edit \
            --test interaction_approval \
            --test interaction_review \
            --test interaction_recovery \
            -- --nocapture --test-threads=1 2>&1 | tee val03.txt
          # A baseline that stops printing is not evidence, and a green step
          # over an empty summary would read as one. Five tasks print a
          # `VAL-03` line (startup prints `PERF-03`), so the counts are pinned:
          # losing a print is a failure here, not a quieter record later.
          #
          # No `^` anchor: under `--nocapture` the harness prefixes the line
          # with the test it came from, `test <name> ... VAL-03 <task>: ...`.
          counted() { grep -cE "$1" val03.txt || true; }
          val03="$(counted 'VAL-03 (find-session|edit-input|approval|review-changes|failure-recovery)')"
          perf03="$(counted 'PERF-03 (cold|warm): ')"
          [ "$val03" -ge 5 ] || { echo "only $val03 VAL-03 lines were printed"; exit 1; }
          [ "$perf03" -ge 2 ] || { echo "only $perf03 PERF-03 cold/warm lines were printed"; exit 1; }
          {
            echo "### VAL-03 baselines (#1910)"
            echo '```'
            grep -oE 'VAL-03 [a-z-]+.*|PERF-03 (cold|warm): .*' val03.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tui-windows:
    name: tui (windows)
    # Same constraint as the engine's Windows job: Windows runner time is
    # expensive, so this stays off both the pull-request and the push path.
    # The nightly schedule is the early warning, and manual dispatch runs it
    # on demand (e.g. to prove a slice green on the same SHA as a PR).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-tui
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-tui

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        # The smoke suite drives real PTYs; run its files one test at a time so
        # concurrent PTY fixtures cannot race each other into false failures.
        #
        # `--no-fail-fast` is not cosmetic: `cargo test` stops at the first
        # failing test binary, and these suites run in name order, so an
        # `input_latency` failure meant `interaction_*` and `smoke` — every
        # Session test — never ran. A red job then proved nothing about the
        # suites behind it, and the launcher rewrite left `smoke` broken while
        # CI reported one unrelated failure.
        run: cargo test --locked --no-fail-fast -- --test-threads=1
