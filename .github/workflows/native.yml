name: native

on:
  push:
    branches:
      - main
    paths:
      - "crates/miao-native/**"
      - "crates/miao-sandbox/**"
      - "packages/native/**"
      - "packages/core/src/sandbox.ts"
      - "packages/core/src/sandbox/**"
      - "packages/core/src/tool/edit.ts"
      - "packages/core/src/tool/edit-fuzzy.ts"
      - "packages/core/src/tool/apply-patch.ts"
      - "packages/core/test/sandbox-policy.test.ts"
      - "packages/core/test/tool-bash-sandbox.test.ts"
      - "packages/miao/src/sandbox-runner.ts"
      - "packages/miao/src/index.ts"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "crates/miao-native/**"
      - "crates/miao-sandbox/**"
      - "packages/native/**"
      - "packages/core/src/sandbox.ts"
      - "packages/core/src/sandbox/**"
      - "packages/core/src/tool/edit.ts"
      - "packages/core/src/tool/edit-fuzzy.ts"
      - "packages/core/src/tool/apply-patch.ts"
      - "packages/core/test/sandbox-policy.test.ts"
      - "packages/core/test/tool-bash-sandbox.test.ts"
      - "packages/miao/src/sandbox-runner.ts"
      - "packages/miao/src/index.ts"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: native
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/miao-native
            crates/miao-sandbox

      - name: Install dependencies
        run: bun install

      - name: Rust tests
        run: cargo test --release
        working-directory: crates/miao-native

      - name: Sandbox crate tests
        run: cargo test --release
        working-directory: crates/miao-sandbox

      - name: Build native addon and sandbox binary
        run: bun run build.ts
        working-directory: crates/miao-native

      - name: Build @miao/native addon
        run: bun run build.ts
        working-directory: packages/native

      - name: Sandbox tests
        run: bun test test/sandbox-policy.test.ts test/tool-bash-sandbox.test.ts
        working-directory: packages/core
        env:
          MIAO_NATIVE: "1"
          MIAO_NATIVE_REQUIRED: "1"

      - name: Self-exec sandbox smoke (seatbelt)
        run: |
          set -euo pipefail
          D=$(mktemp -d)
          bun src/index.ts __sandbox-run --workdir "$D" -- sh -c "echo ok > $D/ok.txt"
          test -f "$D/ok.txt"
          if bun src/index.ts __sandbox-run --workdir "$D" -- sh -c "echo x > $HOME/miao-escape.txt"; then
            echo "outside write unexpectedly succeeded"
            exit 1
          fi
          test ! -f "$HOME/miao-escape.txt"

  sandbox-linux:
    name: sandbox-linux
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/miao-native
            crates/miao-sandbox

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Rust tests and Landlock enforcement (Linux)
        run: cargo test --release
        working-directory: crates/miao-native

      - name: Sandbox crate tests (Linux)
        run: cargo test --release
        working-directory: crates/miao-sandbox

      - name: Install dependencies
        run: bun install

      - name: Build native addon
        run: bun run build.ts
        working-directory: packages/native

      - name: Self-exec sandbox smoke (Landlock)
        run: |
          set -euo pipefail
          D=$(mktemp -d)
          bun src/index.ts __sandbox-run --workdir "$D" -- sh -c "echo ok > $D/ok.txt"
          test -f "$D/ok.txt"
          if bun src/index.ts __sandbox-run --workdir "$D" -- sh -c "echo x > $HOME/miao-escape.txt"; then
            echo "outside write unexpectedly succeeded"
            exit 1
          fi
          test ! -f "$HOME/miao-escape.txt"
          rm -rf "$D"
        working-directory: packages/miao
