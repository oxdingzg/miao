name: test

on:
  push:
    branches:
      - main
    # Docs-only changes cannot affect the suite; skip the run entirely instead
    # of paying for checkout and setup on every one.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "specs/**"
  # The Windows suite runs on the nightly schedule, not per commit (see the
  # `windows` job below).
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The PR job filters by the base commit's SHA, which a shallow clone
          # does not contain.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@mtty.dev"
          git config --global user.name "miao"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Turbo 2.x writes its local cache to <repo>/.turbo/cache. Caching
          # node_modules/.cache/turbo (the pre-2.0 path) silently saved nothing.
          path: .turbo/cache
          # No github.sha in the key: the key must be reusable across commits so
          # an unchanged task can hit an exact match instead of only a prefix.
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # On a PR, run only the packages the change touches (and their
      # dependents) so the suite no longer pays for the whole monorepo on every
      # push. On main, run everything: main is the release gate.
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          filter=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            filter=("--filter=[${{ github.event.pull_request.base.sha }}]")
          fi
          GITHUB_ACTIONS=false bun turbo test "${filter[@]}"

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

  # The Windows suite has known failures tracked in specs/ci-windows.md, so it is
  # not a merge gate. Its setup dominates the run (~6 minutes), so it stays off
  # the PR and push paths and only runs on the nightly schedule and manual
  # dispatch.
  windows:
    name: unit (windows, non-blocking until Windows suite is fixed)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@mtty.dev"
          git config --global user.name "miao"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json', 'bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # The windows-2025 image ships without ripgrep, so tests fall back to downloading it
      # and extracting the zip through PowerShell, which outlasts the 5s test timeout.
      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress

      - name: Run unit tests
        timeout-minutes: 20
        run: GITHUB_ACTIONS=false bun turbo test --continue
        env:
          MIAO_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
