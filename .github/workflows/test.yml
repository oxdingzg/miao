name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to main (or a PR) cancels the still-running run of an older commit
  # instead of queueing behind it.
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.label }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            label: linux
            host: ubuntu-latest
            blocking: true
          # non-blocking until Windows suite is fixed; remaining failures: specs/ci-windows.md
          - name: windows
            label: windows, non-blocking until Windows suite is fixed
            host: windows-2025
            blocking: false
    runs-on: ${{ matrix.settings.host }}
    # The Windows suite has known failures tracked in specs/ci-windows.md. Report them
    # without failing the run so Linux stays the merge gate.
    continue-on-error: ${{ !matrix.settings.blocking }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The PR job filters by the base commit's SHA, which a shallow clone
          # does not contain.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@mtty.dev"
          git config --global user.name "miao"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      # The windows-2025 image ships without ripgrep, so tests fall back to downloading it
      # and extracting the zip through PowerShell, which outlasts the 5s test timeout.
      - name: Install ripgrep
        if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress

      # On a PR, run only the packages the change touches (and their
      # dependents) so the suite no longer pays for the whole monorepo on every
      # push. On main, run everything: main is the release gate.
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          filter=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            filter=("--filter=[${{ github.event.pull_request.base.sha }}]")
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            GITHUB_ACTIONS=false bun turbo test --continue "${filter[@]}"
          else
            GITHUB_ACTIONS=false bun turbo test "${filter[@]}"
          fi
        env:
          MIAO_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated
