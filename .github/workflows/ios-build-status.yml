name: ios-build-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: List recent TestFlight builds
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          python3 - "$RUNNER_TEMP/asc.json" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_API_KEY_P8" <<'PY'
          import base64, json, sys
          out, key_id, issuer_id, p8_b64 = sys.argv[1:5]
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "key_id": key_id,
                      "issuer_id": issuer_id,
                      "key": base64.b64decode(p8_b64).decode(),
                      "in_house": False,
                  },
                  handle,
              )
          PY
          gem install fastlane --no-document
          APPSTORE_BUILD_NUMBER_API_KEY_PATH="$RUNNER_TEMP/asc.json" FASTLANE_APP_IDENTIFIER=dev.miao.remote APPSTORE_PLATFORM=ios fastlane run latest_testflight_build_number
          cat > "$RUNNER_TEMP/Fastfile" <<'RB'
          default_platform(:ios)
          lane :status do
            token = Spaceship::ConnectAPI::Token.from_json_file(ENV["KEY_PATH"])
            Spaceship::ConnectAPI.token = token
            app = Spaceship::ConnectAPI::App.find("dev.miao.remote")
            builds = Spaceship::ConnectAPI::Build.all(app_id: app.id, sorts: "-uploadedDate", includes: "betaAppReviewSubmission,buildBetaDetail", limit: 5)
            builds.each do |b|
              puts "STATUS version=#{b.version} build=#{b.build_version} uploaded=#{b.uploaded_date} processing=#{b.processing_state} encryption=#{b.uses_non_exempt_encryption}"
            end
          end
          RB
          KEY_PATH="$RUNNER_TEMP/asc.json" FASTLANE_SKIP_UPDATE_CHECK=1 "$(gem environment gemdir)/../ruby/gems/3.3.0/bin/fastlane" ios status 2>&1 | grep -E "STATUS|error|Error" || true
