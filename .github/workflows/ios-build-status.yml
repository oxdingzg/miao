name: ios-build-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Query App Store Connect build status
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$key"
          now=$(date +%s); iat=$((now - 60)); exp=$((now + 1200))
          b64() { openssl base64 -e -A | tr -d '=' | tr '/+' '_-'; }
          header=$(printf '{"alg":"ES256","kid":"%s"}' "$APPLE_API_KEY_ID" | b64)
          payload=$(printf '{"iss":"%s","iat":%d,"exp":%d}' "$APPLE_API_ISSUER" "$iat" "$exp" | b64)
          sig=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key" -binary | b64)
          token="${header}.${payload}.${sig}"
          apps=$(curl -sS -H "Authorization: Bearer $token" "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=dev.miao.remote")
          app_id=$(echo "$apps" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"][0]["id"])')
          builds=$(curl -sS -H "Authorization: Bearer $token" "https://api.appstoreconnect.apple.com/v1/builds?filter[app]=$app_id&sort=-uploadedDate&page[limit]=5&include=betaAppReviewSubmission")
          echo "$builds" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          review = {i["id"]: i["attributes"].get("state") for i in d.get("included", []) if i["type"] == "betaAppReviewSubmissions"}
          for b in d.get("data", []):
              a = b["attributes"]
              print("version", a.get("version"), "| uploaded", a.get("uploadedDate"), "| processing", a.get("processingState"), "| encryption-exempt", a.get("usesNonExemptEncryption"))
              sub = (b.get("relationships", {}).get("betaAppReviewSubmission", {}) or {}).get("data")
              if sub:
                  print("   beta review:", review.get(sub.get("id")))
          '
