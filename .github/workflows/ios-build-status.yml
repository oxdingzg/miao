name: ios-build-status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: List recent TestFlight builds
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          python3 - "$RUNNER_TEMP/asc.json" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_API_KEY_P8" <<'PY'
          import base64, json, sys
          out, key_id, issuer_id, p8_b64 = sys.argv[1:5]
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "key_id": key_id,
                      "issuer_id": issuer_id,
                      "key": base64.b64decode(p8_b64).decode(),
                      "in_house": False,
                  },
                  handle,
              )
          PY
          gem install fastlane --no-document
          fastlane pilot builds --api_key_path "$RUNNER_TEMP/asc.json" --platform ios
