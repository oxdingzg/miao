name: nix-hashes
'on':
  workflow_dispatch: null
permissions:
  contents: write
  pull-requests: write
jobs:
  update-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ github.ref_name }}
    - name: Setup git committer
      id: committer
      uses: ./.github/actions/setup-git-committer
      with:
        miao-app-id: ${{ vars.MIAO_APP_ID }}
        miao-app-secret: ${{ secrets.MIAO_APP_SECRET }}
    - name: Stub the computed hash
      run: 'printf ''{"nodeModules":{"x86_64-linux":"sha256-probe-%s"}}\n'' "$GITHUB_RUN_ID" > nix/hashes.json

        cat nix/hashes.json'
    - name: Land hashes through a pull request
      env:
        APP_TOKEN: ${{ steps.committer.outputs.token }}
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        BRANCH: chore/nix-hashes
        DEADLINE_MINUTES: '45'
      run: "set -euo pipefail\n\n# A pull request opened with the workflow token cannot land: GitHub\n# holds the runs it triggers at `action_required` with no jobs, so the\n# required `guard` and `ci-gate` checks never report and the protected\n# branch refuses the merge. The committer app and release's PAT both\n# trigger runs and can merge, so landing needs one of them.\nLAND_TOKEN=\"${APP_TOKEN:-${RELEASE_TOKEN:-}}\"\nif [ -z \"$LAND_TOKEN\" ]; then\n  echo \"::error::Landing the refreshed hash needs MIAO_APP_ID/MIAO_APP_SECRET or RELEASE_TOKEN: the workflow token only opens a pull request whose checks never run\"\n  exit 1\nfi\nexport GH_TOKEN=\"$LAND_TOKEN\"\n\nHASH_FILE=\"nix/hashes.json\"\n\necho \"### Nix hashes\" >> \"$GITHUB_STEP_SUMMARY\"\n\nif [ -z \"$(git status --short -- \"$HASH_FILE\")\" ]; then\n  echo \"No changes to commit\"\n  echo \"Status: no changes\" >> \"$GITHUB_STEP_SUMMARY\"\n  exit 0\nfi\n\ngit add \"$HASH_FILE\"\ngit commit -m \"chore(nix): update node_modules\
        \ hashes\"\n\n# The credential in the remote URL is what authenticates the push, so\n# the landing token goes on the remote rather than the workflow token\n# that setup-git-committer put there.\ngit remote set-url origin \"https://x-access-token:${LAND_TOKEN}@github.com/${GITHUB_REPOSITORY}\"\n\n# Rebasing keeps a reused branch on top of the base branch, which the\n# required-checks rule demands; force because the branch belongs to\n# this workflow, so a retry reuses it instead of leaving one behind.\npush() {\n  git pull --rebase --autostash origin \"$GITHUB_REF_NAME\"\n  git push --force origin \"HEAD:refs/heads/$BRANCH\"\n}\n\npush\n\nPR=\"$(gh pr list --head \"$BRANCH\" --state open --json number -q '.[0].number')\"\nif [ -z \"$PR\" ]; then\n  gh pr create \\\n    --base \"$GITHUB_REF_NAME\" \\\n    --head \"$BRANCH\" \\\n    --title \"chore(nix): update node_modules hashes\" \\\n    --body \"Automated refresh of \\`nix/hashes.json\\` from [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).\"\
        \ \\\n    > /dev/null\nfi\n\n# Auto-merge rather than a direct merge: the required checks have not\n# run yet, and the protected branch refuses a merge while they are\n# missing. Re-running this step on a request that already has it\n# enabled is not an error, so only ask when it is missing.\nif [ \"$(gh pr view \"$BRANCH\" --json autoMergeRequest -q '.autoMergeRequest != null')\" != \"true\" ]; then\n  gh pr merge \"$BRANCH\" --squash --auto\nfi\n\n# Wait for the verdict so a refresh that never lands fails this run\n# instead of leaving an unnoticed pull request behind. A merge to the\n# base branch during the checks leaves this branch behind it, which\n# blocks the merge, so rebase and push again when that happens.\nDEADLINE=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))\nwhile true; do\n  STATE=\"$(gh pr view \"$BRANCH\" --json state -q .state)\"\n  if [ \"$STATE\" = \"MERGED\" ]; then break; fi\n  if [ \"$STATE\" = \"CLOSED\" ]; then\n    echo \"::error::The hash pull request was\
        \ closed without merging\"\n    exit 1\n  fi\n  if [ \"$(date +%s)\" -ge \"$DEADLINE\" ]; then\n    echo \"::error::The hash pull request did not merge within ${DEADLINE_MINUTES} minutes\"\n    exit 1\n  fi\n  if [ \"$(gh pr view \"$BRANCH\" --json mergeStateStatus -q .mergeStateStatus)\" = \"BEHIND\" ]; then\n    push\n  fi\n  sleep 30\ndone\n\n# GitHub deletes the head branch on merge for this repository.\necho \"Status: merged the pull request for $BRANCH\" >> \"$GITHUB_STEP_SUMMARY\"\n"
