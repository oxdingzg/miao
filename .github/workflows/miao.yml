name: miao

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  miao:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /miao') ||
      startsWith(github.event.comment.body, '/miao')) &&
      contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run miao
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          MIAO_API_KEY: ${{ secrets.MIAO_API_KEY }}
          MIAO_PERMISSION: '{"bash": "deny", "webfetch": "deny"}'
        with:
          model: opencode/claude-opus-4-5
