name: release

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Require successful CI for this release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 .github/scripts/check-release-ci.py test.yml typecheck.yml

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIAO_CHANNEL: latest
          GH_REPO: ${{ github.repository }}

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-26 # darwin-arm64
          - host: macos-26-intel # darwin-x64
          - host: ubuntu-latest # linux-x64
          - host: ubuntu-24.04-arm # linux-arm64
          - host: windows-2025 # windows-x64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/miao-native
            crates/miao-sandbox

      - name: Verify native Windows upgrade
        if: runner.os == 'Windows'
        working-directory: packages/miao
        run: bun test test/installation/windows-upgrade.test.ts

      - name: Build and upload this platform
        run: ./packages/miao/script/build.ts --single ${{ runner.os == 'Windows' && '--baseline' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          MIAO_VERSION: ${{ needs.version.outputs.version }}
          MIAO_RELEASE: ${{ needs.version.outputs.release }}

  publish:
    needs:
      - version
      - cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Recheck release commit CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-release-ci.py test.yml typecheck.yml

      # The Chinese notes mirror is committed to `main` after the tag is cut, so
      # it must be read from `main`, not the dispatch SHA (see script/release-notes.ts).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Publish the draft release
        run: |
          set -euo pipefail
          release="v${{ needs.version.outputs.version }}"
          repo="${{ needs.version.outputs.repo }}"
          notes=$(gh release view "$release" --repo "$repo" --json body -q .body)
          # Read the curated English/Chinese pair, not the shorter draft changelog.
          # The helper fails if either versioned document is missing.
          printf '%s' "$notes" | GH_REPO="$repo" bun script/release-notes.ts "$release" > body.md
          gh release edit "$release" --repo "$repo" --draft=false --notes-file body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
