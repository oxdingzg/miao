name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Verified main commit to release (empty uses the dispatch commit)
        required: false
        type: string

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: Require successful CI for this release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 .github/scripts/check-release-ci.py ci.yml

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./script/version.ts
        env:
          # The workflow token writes issues and runs, but this repository's
          # release API refuses it (403 Resource not accessible by integration)
          # even with contents: write, so release writes use a dedicated token
          # and fall back to the workflow token when it is not configured.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          MIAO_CHANNEL: latest
          GH_REPO: ${{ github.repository }}

  cli:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS job builds darwin-arm64 and darwin-x64: the Intel pool
          # takes ten times as long as this sibling and never finished inside a
          # release budget.
          - host: macos-26 # darwin-arm64, darwin-x64
          - host: ubuntu-latest # linux-x64
          - host: ubuntu-24.04-arm # linux-arm64
          - host: windows-2025 # windows-x64
    runs-on: ${{ matrix.host }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: ./.github/actions/setup-bun

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/miao-native
            crates/miao-sandbox
            crates/miao-engine

      - name: Verify native Windows upgrade
        if: runner.os == 'Windows'
        working-directory: packages/miao
        run: bun test test/installation/windows-upgrade.test.ts

      - name: Set up macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_B64: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERT_P12:-}" ]]; then
            echo "APPLE_CERT_P12 is not configured; the binary will be ad-hoc signed"
            exit 0
          fi
          keychain="$RUNNER_TEMP/miao-build.keychain"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security default-keychain -s "$keychain"
          certificate="$RUNNER_TEMP/signing.p12"
          echo "$APPLE_CERT_P12" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "${APPLE_CERT_PASSWORD:-}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm "$certificate"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          {
            echo "MIAO_CODESIGN_IDENTITY=$identity"
            if [[ -n "${APPLE_API_KEY_P8_B64:-}" ]]; then
              key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
              echo "$APPLE_API_KEY_P8_B64" | base64 --decode > "$key_path"
              echo "APPLE_API_KEY_P8=$key_path"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            fi
          } >> "$GITHUB_ENV"

      - name: Build and upload this platform
        run: ./packages/miao/script/build.ts ${{ runner.os == 'macOS' && '--darwin' || '--single' }} ${{ runner.os == 'Windows' && '--baseline' || '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          MIAO_VERSION: ${{ needs.version.outputs.version }}
          MIAO_RELEASE: ${{ needs.version.outputs.release }}

  publish:
    needs:
      - version
      - cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.commit }}
      - name: Recheck release commit CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check-release-ci.py ci.yml

      # The versioned note pair was reviewed with the release commit. Keep the
      # same checkout for the final CI check and notes, even if main advances.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Publish the draft release
        run: |
          set -euo pipefail
          release="v${{ needs.version.outputs.version }}"
          repo="${{ needs.version.outputs.repo }}"
          notes=$(gh release view "$release" --repo "$repo" --json body -q .body)
          # Read the curated English/Chinese pair, not the shorter draft changelog.
          # The helper fails if either versioned document is missing.
          printf '%s' "$notes" | GH_REPO="$repo" bun script/release-notes.ts "$release" > body.md
          gh release edit "$release" --repo "$repo" --draft=false --notes-file body.md
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
