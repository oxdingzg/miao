name: session blackbox

on:
  pull_request:
    paths:
      - "packages/core/src/blackbox/**"
      - "packages/core/src/session/blackbox*.ts"
      - "packages/core/src/session/runner/**"
      - "packages/core/test/blackbox*.test.ts"
      - "packages/core/test/session-runner.test.ts"
      - "packages/miao/src/blackbox/**"
      - "packages/miao/src/engine/**"
      - "packages/miao/test/engine/blackbox*.test.ts"
      - "packages/miao/test/engine/native-tool-replay.test.ts"
      - "crates/miao-engine/**"
      - ".github/workflows/blackbox.yml"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: session blackbox replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build real sidecar
        working-directory: crates/miao-engine
        run: cargo build --locked --bin miao-engine
      - name: Core tape and real Session replay
        working-directory: packages/core
        run: bun test test/blackbox*.test.ts test/session-runner.test.ts
      - name: HTTP and real sidecar replay
        working-directory: packages/miao
        env:
          MIAO_ENGINE_BIN: ${{ github.workspace }}/crates/miao-engine/target/debug/miao-engine
        run: bun test test/engine/blackbox.test.ts test/engine/blackbox-cli.test.ts test/engine/native-tool-replay.test.ts
