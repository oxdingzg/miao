name: session blackbox

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-blackbox-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replay:
    name: session blackbox replay (shard ${{ matrix.shard }}/3)
    strategy:
      # The replay walks every engine test file through the real sidecar; three
      # shards keep it off the critical path of a full run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build real sidecar
        working-directory: crates/miao-engine
        run: cargo build --locked --bin miao-engine
      - name: Core tape and real Session replay
        if: matrix.shard == 1
        working-directory: packages/core
        run: bun test test/blackbox*.test.ts test/session-runner.test.ts
      - name: HTTP and real sidecar replay
        working-directory: packages/miao
        env:
          MIAO_ENGINE_BIN: ${{ github.workspace }}/crates/miao-engine/target/debug/miao-engine
          INTEGRATION_SHARD: ${{ matrix.shard }}
          INTEGRATION_SHARDS: "3"
        run: |
          mapfile -t replay_cases < <(find test/engine -name '*.test.ts' | sort)
          bun run test:integration "${replay_cases[@]}"
