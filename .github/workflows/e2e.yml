name: e2e

# The Playwright suite lives entirely in packages/app and only exercises the
# browser app, so it is its own workflow: `paths` keeps it off every PR that
# cannot affect it, instead of queueing a browser install and a full run
# behind every change.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "bun.lock"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "bun.lock"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/session-ui/**"
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: e2e (${{ matrix.settings.label }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            label: linux
            host: ubuntu-latest
            blocking: true
          # non-blocking until Windows suite is fixed; remaining failures: specs/ci-windows.md
          - name: windows
            label: windows, non-blocking until Windows suite is fixed
            host: windows-2025
            blocking: false
    runs-on: ${{ matrix.settings.host }}
    continue-on-error: ${{ !matrix.settings.blocking }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Check browser Remote Control storage
        if: runner.os == 'Linux'
        run: bun --cwd packages/remote-control check:browser
        timeout-minutes: 3

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        # The Windows run took 28 minutes on windows-2025, right under the old 30-minute cap.
        timeout-minutes: ${{ runner.os == 'Windows' && 45 || 30 }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
