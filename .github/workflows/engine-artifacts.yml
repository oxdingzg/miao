name: engine-artifacts

# The engine archives and their release manifest are published artifacts, not a
# pull-request check. They live in their own workflow so the reusable `engine`
# suite that `ci` calls stays free of jobs that never run: a job skipped by
# `if:` before its matrix is expanded reports its `name:` with the literal
# `${{ matrix.target }}`, which is what made `engine / engine artifact
# (${{ matrix.target }})` show up in every pull request's check list.
on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

concurrency: engine-artifacts-${{ github.ref }}

permissions:
  contents: read

jobs:
  artifacts:
    name: engine artifact (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: crates/miao-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/miao-engine

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          EXE=""
          case "${{ matrix.target }}" in *windows*) EXE=".exe" ;; esac
          mkdir -p dist
          FILE="miao-engine-${{ matrix.target }}${EXE}"
          cp "target/${{ matrix.target }}/release/miao-engine${EXE}" "dist/${FILE}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            HASH=$(sha256sum "${FILE}" | cut -d' ' -f1)
          elif command -v shasum >/dev/null 2>&1; then
            HASH=$(shasum -a 256 "${FILE}" | cut -d' ' -f1)
          else
            HASH=$(certutil -hashfile "${FILE}" SHA256 | sed -n '2p' | tr -d ' \r')
          fi
          printf '%s  %s\n' "${HASH}" "${FILE}" > "${FILE}.sha256"

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miao-engine-${{ matrix.target }}
          path: crates/miao-engine/dist/*
          if-no-files-found: error

  manifest:
    name: engine release manifest
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: miao-engine-*
          path: dist
          merge-multiple: true

      - name: Write release manifest
        run: |
          VERSION=$(jq -r .version package.json)
          FILES=$(cd dist && ls miao-engine-* | grep -v '\.sha256$' | while read -r file; do
            sha=$(cut -d' ' -f1 "${file}.sha256")
            jq -n --arg file "${file}" --arg sha256 "${sha}" '{file:$file,sha256:$sha256}'
          done | jq -s .)
          jq -n --arg version "${VERSION}" --arg commit "${GITHUB_SHA}" --argjson files "${FILES}" \
            '{name:"miao-engine",version:$version,commit:$commit,files:$files}' \
            > "dist/miao-engine-${VERSION}.manifest.json"
          cat "dist/miao-engine-${VERSION}.manifest.json"

      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miao-engine-manifest
          path: dist/*.manifest.json
          if-no-files-found: error
