name: typecheck

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to main (or a PR) cancels the still-running run of an older commit.
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    # Bound the job so a stalled typecheck fails fast instead of running until
    # the runner is reclaimed (and reports as a shutdown signal). The graph
    # completes in ~2 minutes with a warm cache.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Turbo keys each typecheck task on the package's inputs, so a PR that
      # touches a few packages reuses the cached result for every unchanged one.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json', '**/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json', '**/tsconfig.json') }}-
            turbo-typecheck-${{ runner.os }}-

      - name: Run typecheck
        # Bound turbo parallelism: the full graph runs many `tsgo` processes at
        # once, which can exhaust the hosted runner's memory and get SIGKILLed
        # (exit 137) even though a warm run finishes in ~2 minutes. Serializing
        # to a couple of tasks keeps peak memory under the runner limit.
        run: bun typecheck --concurrency=2
