name: typecheck

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # A pull request shares one group per number, so a new push cancels its older
  # run. A push to main groups by commit SHA, so every merged commit gets its own
  # run and keeps a complete status instead of being superseded and cancelled.
  group: ${{ format('{0}-typecheck-{1}', github.workflow, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  typecheck-tasks:
    name: typecheck tasks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Bound the job so a stalled typecheck fails fast instead of running until
    # the runner is reclaimed (and reports as a shutdown signal). The graph
    # completes in ~2 minutes with a warm cache.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The PR filter below names the base commit's SHA, which a shallow
          # clone does not contain.
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Turbo keys each typecheck task on the package's inputs, so a PR that
      # touches a few packages reuses the cached result for every unchanged one.
      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Turbo 2.x writes its local cache to <repo>/.turbo/cache. Caching
          # node_modules/.cache/turbo (the pre-2.0 path) silently saved nothing.
          path: .turbo/cache
          # Restore previous snapshots by prefix, then save newly computed
          # tasks under this commit: Actions cache entries are immutable.
          key: turbo-typecheck-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json', '**/tsconfig.json', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-

      - name: Run typecheck
        # Bound turbo parallelism: the full graph runs many `tsgo` processes at
        # once, which can exhaust the hosted runner's memory and get SIGKILLed
        # (exit 137) even though a warm run finishes in ~2 minutes. Serializing
        # to a couple of tasks keeps peak memory under the runner limit.
        #
        # On a PR, typecheck only the packages the change touches and their
        # dependents; main still typechecks everything.
        run: |
          set -euo pipefail
          filter=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            filter=("--filter=...[${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}]")
          fi
          bun turbo typecheck --concurrency=2 "${filter[@]}"

  typecheck:
    name: typecheck
    needs: [changes, typecheck-tasks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce required result
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.typecheck-tasks.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
