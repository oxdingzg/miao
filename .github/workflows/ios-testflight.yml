name: ios-testflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify required secrets are configured
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Install signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          p12="$RUNNER_TEMP/distribution.p12"
          echo -n "$APPLE_CERT_P12" | base64 --decode -o "$p12"
          keychain="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain
      - name: Require an iOS distribution identity and resolve the team
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          p12="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/build.keychain"
          identities="$(security find-identity -v -p codesigning "$keychain")"
          echo "$identities"
          if ! echo "$identities" | grep -q "Apple Distribution"; then
            echo "::error::APPLE_CERT_P12 has no \"Apple Distribution\" identity. iOS TestFlight cannot be signed with \"Developer ID Application\" (that one is for macOS binaries). Ask the repository owner to upload an Apple Distribution .p12 as a dedicated secret."
            exit 1
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            APPLE_TEAM_ID="$(openssl pkcs12 -in "$p12" -passin "pass:$APPLE_CERT_PASSWORD" -nokeys -clcerts 2>/dev/null \
              | openssl x509 -subject -noout \
              | grep -oE "OU *= *[A-Z0-9]{10}" | head -1 | grep -oE "[A-Z0-9]{10}")"
          fi
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Could not resolve the Apple team id from the certificate; add an APPLE_TEAM_ID secret."
            exit 1
          fi
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          python3 - "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$RUNNER_TEMP/asc.json" <<'PY'
          import json, sys
          key_path, key_id, issuer_id, out = sys.argv[1:5]
          with open(key_path, encoding="utf-8") as handle:
              key = handle.read()
          with open(out, "w", encoding="utf-8") as handle:
              json.dump({"key_id": key_id, "issuer_id": issuer_id, "key": key, "in_house": False}, handle)
          PY
      - name: Archive the app
        env:
          MIAO_DEVELOPMENT_TEAM: ${{ env.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          sh apps/ios/scripts/build-app.sh -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Miao.xcarchive"
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_ID"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          -authenticationKeyID "$APPLE_API_KEY_ID"
          -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          archive
      - name: Export the signed ipa
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$APPLE_TEAM_ID" <<'PY'
          import plistlib, sys
          out, team = sys.argv[1:3]
          with open(out, "wb") as handle:
              plistlib.dump(
                  {"method": "app-store", "teamID": team, "signingStyle": "automatic", "uploadSymbols": True},
                  handle,
                  fmt=plistlib.FMT_XML,
              )
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Miao.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
      - name: Upload to TestFlight
        run: |
          gem install fastlane --no-document
          fastlane pilot upload --api_key_path "$RUNNER_TEMP/asc.json" --ipa "$RUNNER_TEMP/export/Miao.ipa" --skip_waiting
