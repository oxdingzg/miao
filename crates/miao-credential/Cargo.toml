[package]
name = "miao-credential"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Standalone credential daemon: the single refresh writer for engine-owned credential rows"

[[bin]]
name = "miao-credential"
path = "src/main.rs"

[dependencies]
thiserror = "2"
fs2 = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
