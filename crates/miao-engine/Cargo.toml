[package]
name = "miao-engine"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "miao-engine"
path = "src/main.rs"

[dependencies]
aws-config = { version = "=1.8.8", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "=1.106.0"
aws-smithy-types = "=1.3.3"
aws-smithy-runtime-api = "=1.9.1"
async-trait = "0.1"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
cap-std = "3"
cap-fs-ext = "3"
regex = "1"
chrono = "0.4"
croner = "4.0"
jsonschema = { version = "0.33", default-features = false }
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
fs2 = "0.4"
globset = "0.4"
sha2 = "0.10"
libc = "0.2"
miao-sandbox = { path = "../miao-sandbox" }
miao-credential = { path = "../miao-credential" }
tempfile = "3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "gzip", "brotli"] }
htmd = "0.5.6"
scraper = "0.26"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
percent-encoding = "2"
thiserror = "2"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "time", "net", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
crc32fast = "1"
tokio = { version = "1", features = ["test-util"] }
chrono-tz = "0.10"
