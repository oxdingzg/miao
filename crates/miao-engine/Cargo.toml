[package]
name = "miao-engine"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "miao-engine"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
