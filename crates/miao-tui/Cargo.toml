[package]
name = "miao-tui"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/oxdingzg/miao"
homepage = "https://mtty.dev/miao"

[[bin]]
name = "miao-tui"
path = "src/main.rs"

# A scripted stand-in for `miao-engine serve`; `tests/transport.rs` drives it.
[[bin]]
name = "miao-tui-fake-engine"
path = "tests/fixtures/fake_engine.rs"
test = false

[dependencies]
miao-engine = { path = "../miao-engine" }
base64 = "0.22"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Syntax highlighting: TextMate grammars (the family the editor's shiki
# pipeline resolves) with a pure-Rust regex engine, so no C toolchain is needed
# on any of the build targets. `two-face` adds bat's extra definitions.
syntect = { version = "5.3", default-features = false, features = ["default-fancy", "parsing"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["process", "signal", "term"] }

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[build-dependencies]
serde_json = "1"

# Pending crossterm-rs/crossterm#1030: preserve Windows bracketed paste boundaries.
# Pin exact source; do not resolve an unversioned branch at build time.
[patch.crates-io]
crossterm = { git = "https://github.com/eitsupi/crossterm.git", rev = "e2bc49e52a0f5813f5c15ceaa37b673b6b8414a7" }

[[bin]]
name = "embedded_probe"
path = "src/bin/embedded_probe.rs"
