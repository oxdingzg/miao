[package]
name = "miao-tui"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "miao-tui"
path = "src/main.rs"

# A scripted stand-in for `miao-engine serve`; `tests/transport.rs` drives it.
[[bin]]
name = "miao-tui-fake-engine"
path = "tests/fixtures/fake_engine.rs"
test = false

[dependencies]
base64 = "0.22"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"

[build-dependencies]
serde_json = "1"
