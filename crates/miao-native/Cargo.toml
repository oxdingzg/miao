[package]
name = "miao-native"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
similar = "2"
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
