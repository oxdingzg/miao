[package]
name = "miao-native"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "miao-run"
path = "src/bin/miao-run.rs"

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
similar = "2"
regex = "1"
memchr = "2"
gix = { version = "0.88", default-features = false, features = ["status", "revision", "blob-diff", "sha1"] }
tiktoken-rs = "0.12.1"
ignore = "0.4.33"
sha2 = "0.11.0"
blake3 = "1.8.7"
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.4"
miao-sandbox = { path = "../miao-sandbox" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
