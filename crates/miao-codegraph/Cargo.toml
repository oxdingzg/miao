[package]
name = "miao-codegraph"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/oxdingzg/miao"

[dependencies]
thiserror = "2"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
tree-sitter = "0.27.0"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

[dev-dependencies]
tempfile = "3"
