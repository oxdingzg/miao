# Dependency licence policy for the product binary.
#
# `cargo deny check licenses` from this directory is the gate; CI runs it in the
# `cli` job. The allow-list is permissive licences only, because miao is MIT and
# a derivative of opencode under the MIT grant — a copyleft dependency would
# change what the shipped binary can be redistributed as.
#
# Two entries need a word:
#   - MIT-0 is MIT without the attribution requirement; strictly more permissive.
#   - CDLA-Permissive-2.0 covers the Mozilla root-certificate data crates
#     (webpki-roots, webpki-root-certs), which ship CA certificates rather than
#     code. It is a permissive data licence written for exactly that.
[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Nothing in the product's dependency graph may carry a copyleft licence that
# would relicense the binary itself. MPL-2.0 above is file-scoped and does not,
# which is why it is allowed; GPL/AGPL/SSPL would.
[bans]
multiple-versions = "allow"

[advisories]
ignore = []
