[package]
name = "miao-cli"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "miao"
path = "src/main.rs"

[dependencies]
miao-engine = { path = "../miao-engine" }
rhai = { version = "1", default-features = false, features = ["std"] }
rusqlite = "0.32"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
uuid = "1"
miao-tui = { path = "../miao-tui" }
